<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Flashcards · RC Circuits</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
        rel="stylesheet" />
    <script>MathJax = { tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] }, svg: { fontCache: 'global' }, startup: { typeset: false } };</script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async id="MathJax-script"></script>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        :root {
            --bg: #111;
            --card-bg: #181818;
            --border: #2a2a2a;
            --text: #e8e8e8;
            --muted: #888;
            --cyan: #00e5ff;
            --gold: #ffc947;
            --violet: #b06aff;
            --green: #2bff7f;
            --red: #ff4d6a;
            --orange: #ff9500;
        }

        body {
            background: var(--bg);
            font-family: 'Inter', sans-serif;
            color: var(--text);
            min-height: 100vh;
            padding: 0
        }

        /* TOP BAR */
        .topbar {
            display: flex;
            align-items: center;
            gap: .8rem;
            flex-wrap: wrap;
            padding: .9rem 1.5rem;
            border-bottom: 1px solid var(--border);
            background: #151515;
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: .4rem;
            font-size: .78rem;
            color: var(--muted);
            text-decoration: none;
            transition: color .15s;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: .3rem .7rem;
            background: #1a1a1a;
        }

        .back-btn:hover {
            color: var(--text);
            border-color: rgba(255, 255, 255, .2)
        }

        .set-title {
            font-size: .95rem;
            font-weight: 600;
            color: #fff;
            flex: 1
        }

        .set-sub {
            font-size: .75rem;
            color: var(--muted)
        }

        .stats-chips {
            display: flex;
            gap: .5rem;
            margin-left: auto
        }

        .chip {
            font-size: .7rem;
            font-weight: 600;
            padding: .25rem .65rem;
            border-radius: 999px;
            border: 1px solid var(--border)
        }

        /* FILTER TABS */
        .filter-bar {
            display: flex;
            gap: .4rem;
            padding: .8rem 1.5rem;
            background: #151515;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap
        }

        .ftab {
            padding: .28rem .8rem;
            border-radius: 6px;
            font-size: .74rem;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            font-family: 'Inter', sans-serif;
            transition: all .18s
        }

        .ftab.on {
            color: #000;
            background: var(--set-color, var(--violet));
            border-color: transparent
        }

        .ftab:hover:not(.on) {
            color: var(--text);
            border-color: rgba(255, 255, 255, .2)
        }

        /* MAIN */
        .stage {
            max-width: 720px;
            margin: 0 auto;
            padding: 2rem 1.5rem 5rem
        }

        /* PROGRESS */
        .progress-row {
            display: flex;
            align-items: center;
            gap: .8rem;
            margin-bottom: 1.8rem
        }

        .prog-bar {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, .08);
            border-radius: 999px;
            overflow: hidden
        }

        .prog-fill {
            height: 100%;
            border-radius: 999px;
            background: var(--set-color, var(--violet));
            transition: width .5s
        }

        .prog-text {
            font-size: .72rem;
            color: var(--muted);
            white-space: nowrap
        }

        /* CARD */
        .scene {
            perspective: 1400px
        }

        .card-wrap {
            width: 100%;
            min-height: 310px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform .5s cubic-bezier(.4, 0, .2, 1);
            cursor: pointer;
        }

        .card-wrap.flipped {
            transform: rotateY(180deg)
        }

        .face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 14px;
            padding: 1.8rem 2rem;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
        }

        .front {
            background: #1a1a1a;
            box-shadow: 0 4px 30px rgba(0, 0, 0, .4)
        }

        .back {
            background: #161616;
            transform: rotateY(180deg);
            box-shadow: 0 4px 30px rgba(0, 0, 0, .5);
            border-color: var(--set-color, var(--violet))
        }

        /* Card header */
        .card-top {
            display: flex;
            align-items: center;
            gap: .6rem;
            margin-bottom: 1.2rem;
            flex-wrap: wrap
        }

        .set-badge {
            font-size: .64rem;
            font-weight: 600;
            letter-spacing: .1em;
            text-transform: uppercase;
            padding: .2rem .65rem;
            border-radius: 999px;
            border: 1px solid var(--set-color, var(--violet));
            color: var(--set-color, var(--violet))
        }

        .move-badge {
            font-size: .64rem;
            font-weight: 500;
            color: var(--muted);
            background: rgba(255, 255, 255, .05);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: .18rem .5rem
        }

        .card-num {
            margin-left: auto;
            font-size: .7rem;
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace
        }

        .diff-pip {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex-shrink: 0
        }

        /* Question */
        .q-body {
            flex: 1;
            display: flex;
            align-items: center
        }

        .q-text {
            font-size: clamp(.95rem, 2.2vw, 1.15rem);
            font-weight: 500;
            color: #fff;
            line-height: 1.6
        }

        .q-hint {
            font-size: .74rem;
            color: var(--muted);
            margin-top: .8rem;
            font-style: italic
        }

        /* Answer */
        .a-header {
            font-size: .65rem;
            font-weight: 600;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--set-color, var(--violet));
            margin-bottom: .7rem
        }

        .a-body {
            flex: 1;
            font-size: .88rem;
            color: rgba(220, 220, 235, .8);
            line-height: 1.75;
            overflow-y: auto
        }

        .a-body b {
            color: #fff;
            font-weight: 600
        }

        .a-body .hi {
            color: var(--cyan);
            font-weight: 600
        }

        .a-body .gold {
            color: var(--gold);
            font-weight: 600
        }

        .formula-box {
            background: #0d0d0d;
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 8px;
            padding: .7rem 1rem;
            text-align: center;
            margin: .65rem 0;
            font-size: .9rem
        }

        .formula-box.accent {
            border-color: var(--set-color, var(--violet))
        }

        .tip-box {
            background: rgba(176, 106, 255, .05);
            border-left: 2px solid var(--violet);
            border-radius: 0 6px 6px 0;
            padding: .55rem .85rem;
            margin: .5rem 0;
            font-size: .8rem;
            color: var(--muted);
            line-height: 1.6
        }

        /* FLIP HINT */
        .flip-hint {
            text-align: center;
            font-size: .75rem;
            color: var(--muted);
            margin: .7rem 0;
            animation: blink 2s ease-in-out infinite
        }

        @keyframes blink {

            0%,
            100% {
                opacity: .3
            }

            50% {
                opacity: .7
            }
        }

        /* RATINGS */
        .ratings {
            display: none;
            gap: .6rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 1rem
        }

        .ratings.show {
            display: flex
        }

        .rbar {
            width: 100%;
            max-width: 640px;
            display: flex;
            gap: .6rem;
            flex-wrap: wrap
        }

        .rbtn {
            flex: 1;
            min-width: 100px;
            padding: .7rem .5rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #1a1a1a;
            color: var(--muted);
            font-family: 'Inter', sans-serif;
            font-size: .82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all .18s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: .2rem;
        }

        .rbtn:hover {
            transform: translateY(-3px);
            filter: brightness(1.2)
        }

        .rbtn:active {
            transform: scale(.97)
        }

        .rbtn-again {
            border-color: var(--red);
            color: var(--red);
            background: rgba(255, 77, 106, .06)
        }

        .rbtn-hard {
            border-color: var(--orange);
            color: var(--orange);
            background: rgba(255, 149, 0, .06)
        }

        .rbtn-good {
            border-color: var(--cyan);
            color: var(--cyan);
            background: rgba(0, 229, 255, .06)
        }

        .rbtn-easy {
            border-color: var(--green);
            color: var(--green);
            background: rgba(43, 255, 127, .06)
        }

        .rbtn-sub {
            font-size: .64rem;
            font-weight: 400;
            opacity: .6
        }

        /* KEYBOARD HINT */
        .kb-hint {
            text-align: center;
            font-size: .68rem;
            color: rgba(255, 255, 255, .18);
            margin-top: .6rem
        }

        .kb-hint kbd {
            background: rgba(255, 255, 255, .06);
            border: 1px solid rgba(255, 255, 255, .1);
            border-radius: 4px;
            padding: .08rem .35rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: .66rem;
            margin: 0 .1rem
        }

        /* DONE STATE */
        .done-state {
            display: none;
            text-align: center;
            padding: 4rem 2rem;
            max-width: 460px;
            margin: 0 auto
        }

        .done-state.show {
            display: block
        }

        .done-emoji {
            font-size: 3.2rem;
            margin-bottom: .8rem
        }

        .done-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: .5rem
        }

        .done-sub {
            font-size: .85rem;
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 1.5rem
        }

        .done-btns {
            display: flex;
            gap: .7rem;
            justify-content: center;
            flex-wrap: wrap
        }

        .dbtn {
            padding: .55rem 1.4rem;
            border-radius: 8px;
            font-size: .82rem;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            text-decoration: none;
            display: inline-block;
            transition: all .18s
        }

        .dbtn-primary {
            background: var(--set-color, var(--violet));
            color: #000;
            border: none
        }

        .dbtn-ghost {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border)
        }

        .dbtn:hover {
            filter: brightness(1.1);
            transform: translateY(-2px)
        }

        /* EMPTY STATE */
        .empty-state {
            display: none;
            text-align: center;
            padding: 4rem 2rem;
            max-width: 400px;
            margin: 0 auto
        }

        .empty-state.show {
            display: block
        }

        ::-webkit-scrollbar {
            width: 4px
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, .1);
            border-radius: 4px
        }
    </style>
</head>

<body>
    <!-- TOP BAR -->
    <div class="topbar" id="topbar">
        <a class="back-btn" id="backBtn" href="hub.html">← Back</a>
        <div>
            <div class="set-title" id="setTitle">Flashcards</div>
            <div class="set-sub" id="setSub"></div>
        </div>
        <div class="stats-chips">
            <div class="chip" id="chipDue" style="color:var(--gold);border-color:rgba(255,201,71,.3)">— due</div>
            <div class="chip" id="chipMastered" style="color:var(--green);border-color:rgba(43,255,127,.3)">— done</div>
        </div>
    </div>

    <!-- FILTER TABS -->
    <div class="filter-bar">
        <button class="ftab on" data-f="all">All</button>
        <button class="ftab" data-f="due">Due</button>
        <button class="ftab" data-f="new">New</button>
        <button class="ftab" data-f="hard">Struggling</button>
    </div>

    <!-- STAGE -->
    <div class="stage">
        <div id="mainArea">
            <!-- PROGRESS -->
            <div class="progress-row">
                <div class="prog-bar">
                    <div class="prog-fill" id="progFill" style="width:0%"></div>
                </div>
                <div class="prog-text" id="progText">0 of 0</div>
            </div>

            <!-- CARD -->
            <div class="scene">
                <div class="card-wrap" id="cardWrap" onclick="flipCard()">
                    <div class="face front" id="cardFront">
                        <div class="card-top">
                            <span class="set-badge" id="cBadge">—</span>
                            <span class="move-badge" id="cMove">—</span>
                            <span class="card-num" id="cNum">1/1</span>
                            <span class="diff-pip" id="cDiff"></span>
                        </div>
                        <div class="q-body">
                            <div class="q-text" id="qText">Loading…</div>
                        </div>
                        <div class="q-hint" id="qHint"></div>
                    </div>
                    <div class="face back" id="cardBack">
                        <div class="a-header" id="aHeader">Answer</div>
                        <div class="a-body" id="aBody"></div>
                    </div>
                </div>
            </div>

            <div class="flip-hint" id="flipHint">Click card or press Space to reveal answer</div>

            <div class="ratings show" id="ratings" style="display:none!important">
                <div class="rbar">
                    <button class="rbtn rbtn-again" onclick="rate(1)">😰 Again<span class="rbtn-sub"
                            id="t1">&lt;1m</span></button>
                    <button class="rbtn rbtn-hard" onclick="rate(2)">😐 Hard<span class="rbtn-sub"
                            id="t2">~6m</span></button>
                    <button class="rbtn rbtn-good" onclick="rate(3)">😊 Good<span class="rbtn-sub"
                            id="t3">~1d</span></button>
                    <button class="rbtn rbtn-easy" onclick="rate(4)">😎 Easy<span class="rbtn-sub"
                            id="t4">~4d</span></button>
                </div>
            </div>
            <div class="kb-hint"><kbd>Space</kbd> flip &nbsp;·&nbsp; <kbd>1</kbd> Again &nbsp;·&nbsp; <kbd>2</kbd> Hard
                &nbsp;·&nbsp; <kbd>3</kbd> Good &nbsp;·&nbsp; <kbd>4</kbd> Easy</div>
        </div>

        <div class="done-state" id="doneState">
            <div class="done-emoji">🎉</div>
            <div class="done-title">Session done!</div>
            <div class="done-sub" id="doneMsg">All cards reviewed.</div>
            <div class="done-btns">
                <a class="dbtn dbtn-ghost" id="doneBack" href="hub.html">← Back</a>
                <button class="dbtn dbtn-primary" onclick="restartSession()">Review Again</button>
            </div>
        </div>

        <div class="empty-state" id="emptyState">
            <div class="done-emoji">✅</div>
            <div class="done-title">Nothing due!</div>
            <div class="done-sub">All cards scheduled for future. Come back tomorrow.</div>
            <div class="done-btns">
                <a class="dbtn dbtn-ghost" id="emptyBack" href="hub.html">← Back</a>
                <button class="dbtn dbtn-primary" onclick="switchFilter('all')">Study All Anyway</button>
            </div>
        </div>
    </div>

    <script>
        /* ═══════════════════════════════════════
           CARD SETS — problem-specific + pattern
        ═══════════════════════════════════════ */
        const SETS = {

            ex78: {
                label: 'Example 7-8',
                sub: 'Given: $v_C=20e^{-200t}-10$ V',
                color: '#00e5ff',
                back: '../rc-memory-palace/index.html',
                cards: [
                    {
                        id: 'e78-1', move: 'Recognize',
                        q: 'You see $v_C(t)=20e^{-200t}-10$ V. Before doing anything — what structure is this and what template applies?',
                        a: '<b>First-order RC response.</b> The $e^{-200t}$ term = natural response decaying. Fits the skeleton:',
                        formula: '$$x(t)=\\underbrace{A}_{x(\\infty)}+\\underbrace{B}_{\\text{amp}}e^{-t/\\tau}$$',
                        tip: 'A = −10 (forced), B = 20 (natural amplitude), k = 200 → τ = 1/k.', diff: 1
                    },
                    {
                        id: 'e78-2', move: 'Extract τ',
                        q: 'From $v_C=20e^{-200t}-10$, what is the time constant τ? What does it physically mean?',
                        a: 'Exponent is $-200t$. The coefficient is $k=200$. <b>Flip it:</b>',
                        formula: '$$\\tau=\\frac{1}{k}=\\frac{1}{200}=5\\text{ ms}$$',
                        tip: 'At $t=5$ ms (1τ), the transient is 63% done. At $t=25$ ms (5τ), it\'s 99% settled.', diff: 1
                    },
                    {
                        id: 'e78-3', move: 'Freeze t=0',
                        q: 'Apply the Freeze move to $v_C=20e^{-200t}-10$. What is $v_C(0)$?',
                        a: 'Plug $t=0$, so $e^0=1$:',
                        formula: '$$v_C(0)=20(1)-10=\\mathbf{+10\\text{ V}}$$',
                        tip: 'The capacitor starts fully charged to +10 V. After $t=0$ it decays toward −10 V.', diff: 1
                    },
                    {
                        id: 'e78-4', move: 'Melt t→∞',
                        q: 'Apply the Melt move to $v_C=20e^{-200t}-10$. What is $v_C(\\infty)$?',
                        a: 'Let $t\\to\\infty$, so $e^{-\\infty}=0$:',
                        formula: '$$v_C(\\infty)=20(0)-10=\\mathbf{-10\\text{ V}}$$',
                        tip: 'The source drives the capacitor to −10 V at DC steady state. This is the forced response.', diff: 1
                    },
                    {
                        id: 'e78-5', move: 'Zero Crossing',
                        q: 'At what time does $v_C(t)=20e^{-200t}-10$ cross zero? Show the algebra.',
                        a: 'Set $v_C=0$:\n$20e^{-200t}-10=0$\n$e^{-200t}=10/20=0.5$\n$-200t=\\ln(0.5)$',
                        formula: '$$t^*=\\frac{-\\ln(0.5)}{200}=\\frac{\\ln 2}{200}\\approx 3.47\\text{ ms}$$',
                        tip: 'Zero crossing only exists when A and B have opposite signs. Here A=−10, B=+20 → opposite ✓.', diff: 2
                    },
                    {
                        id: 'e78-6', move: 'Blueprint',
                        q: 'Write the ODE that produced $v_C=20e^{-200t}-10$ V.',
                        a: 'From the response: $\\tau=5$ ms, $x(\\infty)=-10$ V. Fill the blueprint:',
                        formula: '$$\\frac{1}{200}\\frac{dv_C}{dt}+v_C=-10\\cdot u(t)$$',
                        tip: 'Verify: substitute the response back into this ODE — it should satisfy it identically.', diff: 2
                    },
                ]
            },

            ex78b: {
                label: 'Exercise 7-8',
                sub: 'Given: $v_C=20-20e^{-1000t}$ V',
                color: '#2bff7f',
                back: 'index.html',
                cards: [
                    {
                        id: 'e78b-1', move: 'Recognize',
                        q: '$v_C(t)=20-20e^{-1000t}$ — what pattern does this match? How is it different from Example 7-8?',
                        a: 'Same skeleton: $A+Be^{-kt}$. Here $A=20$, $B=-20$, $k=1000$.\n\n<b>Difference from Ex 7-8:</b> B is negative → circuit starts at 0 and charges UP. Ex 7-8 started high and decayed down.',
                        formula: '$$x(0)=20+(-20)(1)=0\\text{ V} \\qquad x(\\infty)=20\\text{ V}$$',
                        tip: 'Negative B = charging curve. Positive B = discharging curve.', diff: 1
                    },
                    {
                        id: 'e78b-2', move: 'Extract τ',
                        q: 'What is τ for $v_C=20-20e^{-1000t}$? How does it compare to Example 7-8?',
                        a: 'Exponent coefficient $k=1000$:',
                        formula: '$$\\tau=\\frac{1}{1000}=1\\text{ ms}$$',
                        tip: '5× smaller τ than Example 7-8 (1ms vs 5ms). This circuit reaches steady state 5× faster.', diff: 1
                    },
                    {
                        id: 'e78b-3', move: 'Freeze/Melt',
                        q: 'Find $v_C(0)$ and $v_C(\\infty)$ for $v_C=20-20e^{-1000t}$.',
                        a: '<b>Freeze</b> ($t=0$, $e^0=1$): $v_C(0)=20-20(1)=\\mathbf{0\\text{ V}}$\n\n<b>Melt</b> ($t\\to\\infty$, $e^{-\\infty}=0$): $v_C(\\infty)=20-20(0)=\\mathbf{20\\text{ V}}$',
                        formula: '$$v_C(0)=0\\text{ V} \\qquad v_C(\\infty)=+20\\text{ V}$$',
                        tip: 'Starts at 0 V (uncharged cap), charges to 20 V (step source). Classic charging curve.', diff: 1
                    },
                    {
                        id: 'e78b-4', move: 'Split',
                        q: 'Why is B = −20 for this problem? What does a negative B tell you about the waveform shape?',
                        a: '$B=x(0)-x(\\infty)=0-20=-20$\n\n<b>Negative B means:</b> the natural response ($-20e^{-1000t}$) starts at −20 and rises to 0. Combined with A=+20, the total starts at 0 and rises to +20.',
                        formula: '',
                        tip: '<b>Sign of B:</b> Negative → charging. Positive → discharging. The waveform shape is completely determined by the sign of B.', diff: 2
                    },
                    {
                        id: 'e78b-5', move: 'Blueprint',
                        q: 'Write the ODE for Exercise 7-8 and verify the answer.',
                        a: '$\\tau=1$ms, $x(\\infty)=20$V → fill blueprint:',
                        formula: '$$10^{-3}\\frac{dv_C}{dt}+v_C=20\\cdot u(t)$$',
                        tip: 'Verify: $t=0$ gives $v_C=0$ ✓, $t\\to\\infty$ gives $v_C=20$ V ✓.', diff: 2
                    },
                ]
            },

            ex79a: {
                label: 'Exercise 7-9 (a)',
                sub: 'ODE: $10^{-4}\\dot{v}+v=-5u(t)$, $v(0)=5$V',
                color: '#ffc947',
                back: 'pattern-history.html',
                cards: [
                    {
                        id: 'e79a-1', move: 'Recognize',
                        q: 'You see an ODE: $10^{-4}\\dot{v}_C + v_C = -5u(t)$ with $v_C(0)=5$ V. What does this tell you immediately?',
                        a: 'Standard first-order form $\\tau\\dot{x}+x=f(t)$. This means:\n• Solution = $A+Be^{-t/\\tau}$ form\n• τ is the leading coefficient: $\\tau=10^{-4}$ s\n• $x(\\infty)$ = RHS constant = −5',

            ex79b: {
                label: 'Exercise 7-9 (b)',
                sub: 'ODE: $5\\!\\times\\!10^{-2}\\dot{i}+2000i=10u(t)$, $i(0)=-5$mA',
                color: '#ff4d6a',
                back: 'pattern-history.html',
                cards: [
                    {

                        q: '$5\\times10^{-2}\\dot{i}_L+2000i_L=10u(t)$. Is this RC or RL? Does the skeleton change?',

                        formula: '$$\\tau_{RL}=L/R \\quad \\text{vs} \\quad \\tau_{RC}=RC$$',
                        tip: 'The math is universal. The physics determines τ = L/R vs RC, but the move sequence is identical.', diff: 1
                    },
                    {
                        id: 'e79b-2', move: 'Normalize',
                        q: 'The ODE $5\\times10^{-2}\\dot{i}_L+2000i_L=10u(t)$ is NOT in standard form. What\'s the first step?',

                        formula: '$$\\frac{5\\times10^{-2}}{2000}\\dot{i}_L+i_L=\\frac{10}{2000}u(t)$$',
                        tip: '<b>Critical habit:</b> always check if ODE is in standard form before reading τ. If coefficient of x ≠ 1, normalize first.', diff: 2

                        id: 'e79b-3', move: 'Extract τ',
                        q: 'After normalizing $5\\times10^{-2}\\dot{i}_L+2000i_L=10u(t)$, what is τ?',

                    {

                    {

            pattern: {
                label: 'Universal Pattern',
                sub: 'The 5 moves — works on everything',
                color: '#b06aff',
                back: 'hub.html',
                cards: [
                    {
                        id: 'p1', move: 'All Moves',
                        q: 'Name the 3 numbers you always extract from any first-order circuit problem, and where each comes from.',
                        a: '<b>1. τ</b> — From response: flip k. From ODE: leading coefficient (after normalizing).\n<b>2. x(0)</b> — From response: freeze t=0. Or given directly in problem.\n<b>3. x(∞)</b> — From response: melt t→∞. Or from ODE RHS.',
                        formula: '$$x(t)=\\underbrace{x(\\infty)}_{3}+[\\underbrace{x(0)}_{2}-x(\\infty)]e^{-t/\\underbrace{\\tau}_{1}}$$',
                        tip: 'These 3 numbers ARE the complete solution. Writing the answer after is mechanical.', diff: 1
                    },
                    {
                        id: 'p2', move: 'Extract τ',
                        q: 'Fill in: "For standard-form ODE $\\tau\\dot{x}+x=f(t)$, τ is ___. For a response $Ae^{-kt}$, τ is ___."',
                        a: 'For standard ODE $\\tau\\dot{x}+x=f$: τ = <b>the leading coefficient</b> (read directly).\n\nFor response $Ae^{-kt}$: τ = <b>1/k</b> (flip the exponent coefficient).',
                        formula: '$$\\tau_{\\text{ODE}}=\\text{leading coeff} \\qquad \\tau_{\\text{response}}=1/k$$',
                        tip: 'When ODE is NOT in standard form (coeff of x ≠ 1): normalize by dividing first.', diff: 1
                    },
                    {
                        id: 'p3', move: 'Freeze/Melt',
                        q: 'Why does the Freeze/Melt approach work mathematically?',
                        a: '<b>Freeze</b> ($t=0$): $e^{0}=1$ — the exponential contributes its full value. No decay yet. → Gives $x(0)=A+B$.\n\n<b>Melt</b> ($t\\to\\infty$): $e^{-\\infty}=0$ — all exponential terms vanish. Only DC terms survive. → Gives $x(\\infty)=A$.',
                        formula: '$$x(0)=A+B \\qquad x(\\infty)=A$$',
                        tip: 'These are just substitutions — no calculus needed. Two plug-and-read operations.', diff: 1
                    },
                    {
                        id: 'p4', move: 'Verify',
                        q: 'What are the two verification checkpoints every answer MUST pass?',
                        a: '<b>Checkpoint 1 — Freeze:</b> Substitute $t=0$. Does your answer give the known $x(0)$? If not → fix B.\n\n<b>Checkpoint 2 — Melt:</b> Let $t\\to\\infty$. Does your answer give the known $x(\\infty)$? If not → fix A.',
                        formula: '$$v_C(0)\\stackrel{?}{=}\\text{given} \\qquad v_C(\\infty)\\stackrel{?}{=}\\text{forced}$$',
                        tip: 'Two checkpoints, two seconds each. No excuse for not verifying.', diff: 1
                    },
                ]
            }
        };

        // "all" = merge all sets
        SETS.all = {
            label: 'All Flashcards',
            sub: 'Every problem + universal pattern',
            color: '#b06aff',
            back: 'hub.html',
            cards: Object.keys(SETS).filter(k => k !== 'all').flatMap(k => SETS[k].cards)
        };

        /* ═══════════════════════════════════════
           PARSE URL & INIT
        ═══════════════════════════════════════ */
        const params = new URLSearchParams(location.search);
        let SET_KEY = params.get('set') || 'all';
        if (!SETS[SET_KEY]) SET_KEY = 'all';
        const BACK = params.get('back');
        const CURRENT_SET = SETS[SET_KEY];
        const SET_COLOR = CURRENT_SET.color;

        // Apply color
        document.documentElement.style.setProperty('--set-color', SET_COLOR);

        // Set labels
        document.getElementById('setTitle').textContent = CURRENT_SET.label;
        document.getElementById('setSub').innerHTML = CURRENT_SET.sub;
        document.getElementById('backBtn').href = BACK ? (BACK === 'hub' ? 'hub.html' : BACK) : CURRENT_SET.back;

        /* ═══════════════════════════════════════
           SM-2 ENGINE
        ═══════════════════════════════════════ */
        const SK = 'ankiRC_' + SET_KEY;
        let cardStates = {};
        try { const d = JSON.parse(localStorage.getItem(SK) || '{}'); cardStates = { ...d } } catch (e) { }

        function getCS(id) {
            if (!cardStates[id]) cardStates[id] = { interval: 0, ease: 2.5, reps: 0, nextDue: 0, lapses: 0 };
            return cardStates[id];
        }
        function saveStates() { localStorage.setItem(SK, JSON.stringify(cardStates)) }

        function sm2(cs, rating) {
            const now = Date.now(), c = { ...cs };
            if (rating === 1) { c.interval = 1; c.reps = 0; c.lapses++; c.nextDue = now + 60000 }
            else {
                const e = rating === 2 ? Math.max(1.3, c.ease - .15) : rating === 4 ? c.ease + .15 : c.ease;
                c.ease = Math.round(e * 100) / 100;
                if (c.reps === 0) c.interval = 1;
                else if (c.reps === 1) c.interval = 6;
                else c.interval = Math.round(c.interval * c.ease);
                if (rating === 2) c.interval = Math.max(1, Math.round(c.interval * .5));
                if (rating === 4) c.interval = Math.round(c.interval * 1.3);
                c.reps++; c.nextDue = now + c.interval * 86400000;
            }
            return c;
        }

        function nextLabel(rating, cs) {
            const s = sm2(cs, rating);
            const d = s.interval;
            if (rating === 1) return '<1m';
            if (d <= 1) return '~1d';
            if (d < 7) return `~${d}d`;
            return `~${Math.round(d / 7)}w`;
        }

        /* ═══════════════════════════════════════
           SESSION
        ═══════════════════════════════════════ */
        let FILTER = 'all', queue = [], idx = 0, sessionDone = 0, isFlipped = false;

        function buildQueue() {
            const now = Date.now(), cards = CURRENT_SET.cards;
            if (FILTER === 'new') return cards.filter(c => getCS(c.id).reps === 0);
            if (FILTER === 'due') return cards.filter(c => getCS(c.id).nextDue <= now && getCS(c.id).reps > 0);
            if (FILTER === 'hard') return cards.filter(c => getCS(c.id).lapses > 0);
            return cards.filter(c => getCS(c.id).nextDue <= now);
        }

        function updateChips() {
            const now = Date.now(), cards = CURRENT_SET.cards;
            const due = cards.filter(c => getCS(c.id).nextDue <= now).length;
            const mastered = cards.filter(c => getCS(c.id).interval >= 21).length;
            document.getElementById('chipDue').textContent = due + ' due';
            document.getElementById('chipMastered').textContent = mastered + ' done';
        }

        function updateProg() {
            const total = queue.length + sessionDone || 1;
            const pct = Math.round((sessionDone / total) * 100);
            document.getElementById('progFill').style.width = pct + '%';
            document.getElementById('progText').textContent = `${sessionDone} of ${total}`;
        }

        function showCard() {
            if (idx >= queue.length) { showDone(); return }
            const card = queue[idx];
            const cs = getCS(card.id);
            isFlipped = false;
            document.getElementById('cardWrap').classList.remove('flipped');
            const r = document.getElementById('ratings');
            r.style.cssText = 'display:none!important';
            document.getElementById('flipHint').style.display = 'block';

            document.getElementById('cBadge').textContent = CURRENT_SET.label;
            document.getElementById('cBadge').style.borderColor = SET_COLOR;
            document.getElementById('cBadge').style.color = SET_COLOR;
            document.getElementById('cMove').textContent = card.move;
            document.getElementById('cNum').textContent = `${idx + 1}/${queue.length}`;
            const dc = ['', '#2bff7f', '#ffc947', '#ff4d6a'];
            document.getElementById('cDiff').style.background = dc[card.diff] || '#888';
            document.getElementById('qText').innerHTML = card.q;
            document.getElementById('qHint').textContent = card.diff === 3 ? '💀 Tricky — think carefully' : '';

            // Back
            document.getElementById('aHeader').style.color = SET_COLOR;
            let aHTML = card.a.replace(/\n/g, '<br/>');
            if (card.formula) aHTML += `<div class="formula-box accent">${card.formula}</div>`;
            if (card.tip) aHTML += `<div class="tip-box">${card.tip}</div>`;
            document.getElementById('aBody').innerHTML = aHTML;

            // Interval previews
            [1, 2, 3, 4].forEach((r, i) => { document.getElementById('t' + (i + 1)).textContent = nextLabel(r, cs) });

            setTimeout(() => {
                if (window.MathJax && MathJax.typesetPromise) {
                    MathJax.typesetPromise([document.getElementById('cardFront'), document.getElementById('cardBack')]).catch(() => { });
                }
            }, 60);
            updateProg(); updateChips();
        }

        function flipCard() {
            if (isFlipped) return;
            isFlipped = true;
            document.getElementById('cardWrap').classList.add('flipped');
            document.getElementById('ratings').style.cssText = 'display:flex!important';
            document.getElementById('flipHint').style.display = 'none';
            setTimeout(() => {
                if (window.MathJax && MathJax.typesetPromise)
                    MathJax.typesetPromise([document.getElementById('cardBack')]).catch(() => { });
            }, 300);
        }

        function rate(r) {
            const card = queue[idx];
            const newCS = sm2(getCS(card.id), r);
            cardStates[card.id] = newCS;
            saveStates();
            if (r === 1) queue.push(card); // again → push to end
            sessionDone++; idx++;
            showCard();
        }

        function showDone() {
            document.getElementById('mainArea').style.display = 'none';
            document.getElementById('doneState').classList.add('show');
            const mastered = CURRENT_SET.cards.filter(c => getCS(c.id).interval >= 21).length;
            document.getElementById('doneMsg').textContent =
                `${sessionDone} cards reviewed. ${mastered}/${CURRENT_SET.cards.length} mastered for "${CURRENT_SET.label}".`;
            document.getElementById('doneBack').href = CURRENT_SET.back;
        }

        function restartSession() {
            document.getElementById('doneState').classList.remove('show');
            document.getElementById('emptyState').classList.remove('show');
            document.getElementById('mainArea').style.display = 'block';
            sessionDone = 0; idx = 0;
            queue = CURRENT_SET.cards.slice(); // force all on restart
            showCard();
        }

        function switchFilter(f) {
            FILTER = f;
            document.getElementById('emptyState').classList.remove('show');
            document.getElementById('doneState').classList.remove('show');
            document.getElementById('mainArea').style.display = 'block';
            sessionDone = 0; idx = 0;
            queue = buildQueue();
            if (queue.length === 0 && f !== 'all') { switchFilter('all'); return }
            if (queue.length === 0) {
                document.getElementById('mainArea').style.display = 'none';
                document.getElementById('emptyState').classList.add('show');
                document.getElementById('emptyBack').href = CURRENT_SET.back;
            } else showCard();
        }

        // Filter tabs
        document.querySelectorAll('.ftab').forEach(t => {
            t.addEventListener('click', () => {
                document.querySelectorAll('.ftab').forEach(x => x.classList.remove('on'));
                t.classList.add('on');
                FILTER = t.dataset.f;
                queue = buildQueue();
                if (queue.length === 0 && FILTER !== 'all') {
                    document.getElementById('mainArea').style.display = 'none';
                    document.getElementById('emptyState').classList.add('show');
                } else {
                    document.getElementById('emptyState').classList.remove('show');
                    document.getElementById('mainArea').style.display = 'block';
                    sessionDone = 0; idx = 0; showCard();
                }
            });
        });

        // Keyboard
        document.addEventListener('keydown', e => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.code === 'Space') { e.preventDefault(); if (!isFlipped) flipCard() }
            if (e.key === '1' && isFlipped) rate(1);
            if (e.key === '2' && isFlipped) rate(2);
            if (e.key === '3' && isFlipped) rate(3);
            if (e.key === '4' && isFlipped) rate(4);
        });

        // INIT
        switchFilter('all');
    </script>
