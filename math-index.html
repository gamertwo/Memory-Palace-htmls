<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Math Index Redirect</title>
    <meta http-equiv="refresh" content="0; url=math-hub.html" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=Cinzel:wght@700;900&display=swap"
        rel="stylesheet" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0b1018;
            --panel: #141c2a;
            --border: #243149;
            --text: #eaf0ff;
            --muted: #8fa0c5;
            --accent: #d3c8ff;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            padding: 1rem;
        }

        .card {
            width: min(680px, 100%);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.2rem;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.45rem;
            margin-bottom: .5rem;
        }

        p {
            color: var(--muted);
            line-height: 1.65;
            font-size: .92rem;
        }

        .links {
            display: flex;
            gap: .6rem;
            flex-wrap: wrap;
            margin-top: .9rem;
        }

        .links a {
            text-decoration: none;
            padding: .4rem .7rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--accent);
            font-size: .8rem;
        }
    </style>
</head>

<body>
    <main class="card">
        <h1>Math Index Moved</h1>
        <p>
            Redirecting to <strong>math-hub.html</strong>. If the redirect does not fire,
            use one of the links below.
        </p>
        <div class="links">
            <a href="math-hub.html">Go to Hub</a>
            <a href="math-concepts.html">Go to Concepts</a>
            <a href="math-questions.html">Go to Questions</a>
            <a href="math-solutions.html">Go to Solutions</a>
        </div>
    </main>

    <script>
        window.location.replace('math-hub.html');
    </script>
</body>

</html>
